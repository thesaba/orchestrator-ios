<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications, dark</title>
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 400px; height: 560px; box-sizing: border-box; padding: 28px 24px; background: #1F2A36; color: #F5F5F7; display: flex; flex-direction: column; gap: 12px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">

<div style="padding: 12px; border-radius: 16px; background: #262628; border: 1px solid #48484D; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); display: flex; gap: 10px; align-items: flex-start">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 9px; background: #0064E0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2"></circle><circle cx="3" cy="3.5" r="1.3"></circle><circle cx="13" cy="3.5" r="1.3"></circle><circle cx="8" cy="13.5" r="1.3"></circle><path d="M4 4.4 6.5 6.7M12 4.4 9.5 6.7M8 10v2.2"></path></svg>
</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px">
<div style="font-size: 13px; font-weight: 600">Deploy finished</div>
<div style="font-size: 11px; color: #9A9AA3">now</div>
</div>
<div style="font-size: 13px; color: #B4B4BC">FleetDesk · main · 7be02d1 · 2 m 14 s</div>
</div>
</div>

<div style="display: flex; gap: 10px; align-items: flex-start">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 9px; background: #0064E0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2"></circle><circle cx="3" cy="3.5" r="1.3"></circle><circle cx="13" cy="3.5" r="1.3"></circle><circle cx="8" cy="13.5" r="1.3"></circle><path d="M4 4.4 6.5 6.7M12 4.4 9.5 6.7M8 10v2.2"></path></svg>

<div style="font-size: 11px; color: #9A9AA3">1 min ago</div>
</div>
<div style="font-size: 13px; color: #B4B4BC">citynet.ge stopped at Migrate. The previous release is still live.</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button style="height: 28px; padding: 0; border: 0; border-radius: 7px; background: #0064E0; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 600">Explain</button>
<button style="height: 28px; padding: 0; border: 0; border-radius: 7px; background: #3D3D42; color: #F5F5F7; font-family: inherit; font-size: 12px; font-weight: 500">Open log</button>
<button style="height: 28px; padding: 0; border: 0; border-radius: 7px; background: #3D3D42; color: #F5F5F7; font-family: inherit; font-size: 12px; font-weight: 500">Retry</button>

</div>

<div style="padding: 12px; border-radius: 16px; background: #262628; border: 1px solid #48484D; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 10px; align-items: flex-start">

<div style="font-size: 11px; color: #9A9AA3">12 min ago</div>
</div>
<div style="font-size: 13px; color: #B4B4BC">do-fra-db-01 · Frankfurt · 4.6 GB free</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<button style="height: 28px; padding: 0; border: 0; border-radius: 7px; background: #3D3D42; color: #F5F5F7; font-family: inherit; font-size: 12px; font-weight: 500">Open server</button>
<button style="height: 28px; padding: 0; border: 0; border-radius: 7px; background: #3D3D42; color: #F5F5F7; font-family: inherit; font-size: 12px; font-weight: 500">Mute for 1 hour</button>
</div>
</div>

<div style="padding: 12px; border-radius: 16px; background: #262628; border: 1px solid #48484D; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 10px; align-items: flex-start">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 9px; background: #0064E0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">

</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">

<div style="font-size: 11px; color: #9A9AA3">09:00</div>
</div>
<div style="font-size: 13px; color: #B4B4BC">staging.citynet.ge</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<button style="height: 28px; padding: 0; border: 0; border-radius: 7px; background: #0064E0; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 600">Renew now</button>
<button style="height: 28px; padding: 0; border: 0; border-radius: 7px; background: #3D3D42; color: #F5F5F7; font-family: inherit; font-size: 12px; font-weight: 500">Remind tomorrow</button>
