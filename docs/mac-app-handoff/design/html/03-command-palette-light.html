<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette, light</title>
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 880px; height: 600px; box-sizing: border-box; position: relative; overflow: hidden; background: #B9C6D4; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">

<div style="position: absolute; left: 120px; top: 44px; width: 640px; box-sizing: border-box; border-radius: 16px; background: #F5F5F7; border: 1px solid #D8D8DE; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.2); overflow: hidden; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 18px; border-bottom: 1px solid #D8D8DE">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#55555C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="7" cy="7" r="4.2"></circle><path d="m10.2 10.2 3.3 3.3"></path></svg>
<input type="text" aria-label="Command" value="deploy ci" style="flex-grow: 1; min-width: 0; height: 40px; padding: 0; border: 0; outline: none; background: transparent; color: #1D1D1F; font-family: inherit; font-size: 20px">
<span style="padding: 2px 7px; border-radius: 5px; background: #E9E9EE; color: #55555C; font-size: 11px">esc</span>
</div>

<div style="display: flex; flex-direction: column; gap: 2px; padding: 8px">

<div style="padding: 6px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #63636B">ACTIONS</div>

<button style="display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 10px; border: 0; border-radius: 9px; background: #0064E0; color: #FFFFFF; font-family: inherit; text-align: left">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; background: #2B7BEA; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3.5M4 7.2 8 3.2l4 4"></path></svg></span>
<span style="font-size: 14px; font-weight: 600">Deploy citynet.ge</span>
<span style="flex-grow: 1; font-size: 12px; color: #EAF2FF">main · 3 commits pending</span>
<span style="padding: 2px 7px; border-radius: 5px; background: #2B7BEA; color: #FFFFFF; font-size: 11px">↵</span>
</button>

<button style="display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: #1D1D1F; font-family: inherit; text-align: left">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; background: #E9E9EE; color: #1D1D1F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3.5M4 7.2 8 3.2l4 4"></path></svg></span>
<span style="font-size: 14px; font-weight: 500">Deploy staging.citynet.ge</span>
<span style="flex-grow: 1; font-size: 12px; color: #55555C">develop · 1 commit pending</span>
</button>

<button style="display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: #1D1D1F; font-family: inherit; text-align: left">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; background: #E9E9EE; color: #1D1D1F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h6.5a3.5 3.5 0 0 1 0 7H6M5.5 3.8 2.8 6.5l2.7 2.7"></path></svg></span>
<span style="font-size: 14px; font-weight: 500">Roll back citynet.ge</span>
<span style="flex-grow: 1; font-size: 12px; color: #55555C">to release 24 Nov, 18:02</span>
<span style="padding: 2px 7px; border-radius: 5px; background: #E9E9EE; color: #55555C; font-size: 11px">Touch ID</span>
</button>

<button style="display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: #1D1D1F; font-family: inherit; text-align: left">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; background: #E9E9EE; color: #1D1D1F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6 4.5V3h4v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"></path></svg></span>
<span style="font-size: 14px; font-weight: 500">Clear cache · citynet.ge</span>
<span style="flex-grow: 1; font-size: 12px; color: #55555C">config, routes, views</span>
</button>

<button style="display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: #1D1D1F; font-family: inherit; text-align: left">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; background: #E9E9EE; color: #1D1D1F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2 14.2 13H1.8L8 2.2Z"></path><path d="M8 6.5v3.2M8 11.4v.2"></path></svg></span>
<span style="font-size: 14px; font-weight: 500">Maintenance mode on · citynet.ge</span>
<span style="flex-grow: 1; font-size: 12px; color: #55555C">site goes offline for visitors</span>
<span style="padding: 2px 7px; border-radius: 5px; background: #E9E9EE; color: #55555C; font-size: 11px">Touch ID</span>
</button>

<div style="padding: 10px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #63636B">SERVERS</div>

<button style="display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: #1D1D1F; font-family: inherit; text-align: left">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; background: #E9E9EE; color: #1D1D1F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"></rect><path d="m4.5 6 2.2 2-2.2 2M8.5 10.2h3"></path></svg></span>
<span style="font-size: 14px; font-weight: 500">SSH into do-fra-web-01</span>
<span style="flex-grow: 1; font-size: 12px; color: #55555C">hosts citynet.ge · opens Terminal</span>
</button>

<div style="padding: 10px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #63636B">OPEN</div>

<button style="display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: #1D1D1F; font-family: inherit; text-align: left">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; background: #E9E9EE; color: #1D1D1F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3.5h10M3 6.5h10M3 9.5h7M3 12.5h5"></path></svg></span>
<span style="font-size: 14px; font-weight: 500">Last deploy log · citynet.ge</span>
<span style="flex-grow: 1; font-size: 12px; color: #55555C">24 Nov, 18:02 · succeeded</span>
</button>

</div>

<div style="display: flex; align-items: center; gap: 16px; height: 38px; padding: 0 16px; border-top: 1px solid #D8D8DE; background: #FFFFFF; font-size: 11px; color: #55555C">
<span style="display: flex; align-items: center; gap: 6px"><span style="padding: 2px 6px; border-radius: 5px; background: #E9E9EE">↵</span>Run</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="padding: 2px 6px; border-radius: 5px; background: #E9E9EE">⌘ ↵</span>Run and show log</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="padding: 2px 6px; border-radius: 5px; background: #E9E9EE">⌥ ↵</span>Choose branch</span>
<span style="flex-grow: 1"></span>
<span>7 results</span>
</div>

</div>
</div>
</body>
</html>
